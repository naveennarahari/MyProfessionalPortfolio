<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Naveen Narahari | Portfolio</title>
    <script>
      // GitHub Pages SPA routing fix
      // Redirects 404s back to the index page so React Router can handle routing
      var pathSegmentsToKeep = 1; // 1 = keep /MyProfessionalPortfolio in the path

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
